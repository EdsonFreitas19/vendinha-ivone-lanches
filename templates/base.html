<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ store_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='interativo.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">🌭 {{ store_name }}</a>
    <nav>
      {% if is_admin %}
        <a href="{{ url_for('admin') }}">Painel</a>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf_token }}">
          <button class="link" type="submit">Sair</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Entrar</a>
      {% endif %}
    </nav>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">{{ store_name }}</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
